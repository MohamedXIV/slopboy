name: P0 internal validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.tools.json'
      - '.github/workflows/p0-internal.yml'

permissions:
  contents: read

concurrency:
  group: p0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # NEVER run arbitrary code from a fork. Community cartridge validation needs
    # a separate trusted data-only pipeline before enabling public submissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve HeroUI v3 with npm registry and regenerate lockfile
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Emit regenerated pnpm lockfile for reviewed GitHub commit
        run: |
          echo SLOPBOY_HEROUI_LOCK_BEGIN
          cat pnpm-lock.yaml
          echo SLOPBOY_HEROUI_LOCK_END
      - name: Unit tests
        run: pnpm test
      - name: Chromium sandbox isolation regression
        run: pnpm security:browser
      - name: Creator Kit round-trip (no game execution)
        run: |
          pnpm creator:new ci-smoke
          pnpm creator:check ci-smoke
          pnpm creator:build ci-smoke
          pnpm creator:verify ci-smoke
          pnpm creator:preview ci-smoke
          test -f creations/ci-smoke/dist/ci-smoke.preview.html
      - name: Browser smoke local Creator Preview
        run: pnpm security:creator-preview
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Static export build
        run: pnpm build
      - name: V2 real-browser playable device regression
        run: pnpm security:v2-browser
      - name: Real Chromium KAPLAY isolated rendering spike
        run: pnpm security:kaplay-spike
      - name: Verify playable build artifacts
        run: |
          pnpm cartridge:verify
          test -f apps/web/out/cartridges/tiny-catcher.slop
          test -f apps/web/out/cartridges/star-patrol.slop
          test -f apps/web/out/cartridges/circuit-slide.slop
          test -f apps/web/out/library.html || test -f apps/web/out/library/index.html
          test -f apps/web/out/play/star-patrol.html || test -f apps/web/out/play/star-patrol/index.html
          test -f apps/web/out/play/circuit-slide.html || test -f apps/web/out/play/circuit-slide/index.html
          test -f apps/web/out/play.html || test -f apps/web/out/play/index.html
          test -f apps/web/out/create.html || test -f apps/web/out/create/index.html
          test -f apps/web/out/v2.html || test -f apps/web/out/v2/index.html
          test -f apps/web/out/v2/play/tiny-catcher.html || test -f apps/web/out/v2/play/tiny-catcher/index.html
          test -f apps/web/out/v2/kaplay-spike.html
          test -f apps/web/out/v2/spikes/kaplay.html || test -f apps/web/out/v2/spikes/kaplay/index.html
          test -f apps/web/out/sw.js
          node --check apps/web/out/sw.js
          test -f apps/web/out/offline-build.json
          test -f apps/web/out/manifest.webmanifest
          test -f apps/web/out/icons/slopboy-192.png
          test -f apps/web/out/icons/slopboy-512.png
          grep -q '/cartridges/circuit-slide.slop' apps/web/out/sw.js
