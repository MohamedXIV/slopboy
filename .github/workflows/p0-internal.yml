name: P0 internal validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.tools.json'
      - '.github/workflows/p0-internal.yml'

permissions:
  contents: read

concurrency:
  group: p0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # NEVER run arbitrary code from a fork. Community cartridge validation needs
    # a separate trusted data-only pipeline before enabling public submissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary lockfile resolution step used only on this PR to capture
      # the exact pnpm generated dependency graph, removed immediately after.
      - name: Resolve auth database driver lockfile (temporary)
        if: ${{ github.head_ref == 'feat/26-neon-auth-session' }}
        run: |
          pnpm install --ignore-scripts --lockfile-only --no-frozen-lockfile
          python3 - <<'PY'
          from pathlib import Path
          import base64
          raw=base64.b64encode(Path('pnpm-lock.yaml').read_bytes()).decode()
          for i in range(0,len(raw),4000):
              print('SLOPBOY_LOCK_CHUNK:'+raw[i:i+4000])
          print('SLOPBOY_LOCK_END')
          PY
      - name: Install without lifecycle scripts
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Install PostgreSQL 18 for real migration integration tests
        if: ${{ hashFiles('packages/database/migrations/*.sql') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-18
      - name: Unit tests
        run: pnpm test
      - name: Chromium sandbox isolation regression
        run: pnpm security:browser
      - name: Creator Kit round-trip (no game execution)
        run: |
          pnpm creator:new ci-smoke
          pnpm creator:check ci-smoke
          pnpm creator:build ci-smoke
          pnpm creator:verify ci-smoke
          pnpm creator:preview ci-smoke
          test -f creations/ci-smoke/dist/ci-smoke.preview.html
      - name: Browser smoke local Creator Preview
        run: pnpm security:creator-preview
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production Next.js server build and PWA assets
        run: pnpm build
      - name: Dynamic runtime UUID and reviewed metadata smoke
        run: pnpm security:runtime-routes
      - name: V2 real-browser playable device regression
        run: pnpm security:v2-browser
      - name: Real Chromium KAPLAY isolated rendering spike
        run: pnpm security:kaplay-spike
      - name: KAPLAY vetted game through real HostSession browser integration
        if: ${{ hashFiles('tools/kaplay-host-browser-smoke.ts') != '' }}
        run: pnpm security:kaplay-host
      - name: Chromium offline PWA install / guest save / uninstall regression
        run: pnpm security:pwa-browser
      - name: Verify runtime Next deployment artifacts
        run: |
          pnpm cartridge:verify
          test -f apps/web/.next/BUILD_ID
          test -f apps/web/public/cartridges/tiny-catcher.slop
          test -f apps/web/public/cartridges/star-patrol.slop
          test -f apps/web/public/cartridges/circuit-slide.slop
          test -f apps/web/public/sw.js
          node --check apps/web/public/sw.js
          test -f apps/web/public/offline-build.json
          test -f apps/web/public/icons/slopboy-192.png
          test -f apps/web/public/icons/slopboy-512.png
          grep -q 'slopboy-installed-index-v3' apps/web/public/sw.js
          grep -q 'SL_OP_INSTALL' apps/web/public/sw.js
