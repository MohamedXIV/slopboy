name: P0 internal validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.tools.json'
      - '.github/workflows/p0-internal.yml'

permissions:
  contents: read

concurrency:
  group: p0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # NEVER run arbitrary code from a fork. Community cartridge validation needs
    # a separate trusted data-only pipeline before enabling public submissions.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without lifecycle scripts (lockfile pending)
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Static export build
        run: pnpm build
